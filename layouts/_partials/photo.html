{{- $args := . -}}{{- $ledger := readFile "docs/image-licenses.json" | transform.Unmarshal -}}
{{- range where $ledger.images "id" .id -}}
<figure class="food-photo {{ $args.class }}{{ if $args.compact }} photo-compact{{ end }}" data-photo="{{ .id }}">
{{ with $args.href }}<a href="{{ . }}" tabindex="-1" aria-hidden="true">{{ end }}<img src="{{ strings.TrimPrefix "static/" .local_path | relURL }}" alt="{{ .alt }}" width="{{ .width }}" height="{{ .height }}" {{ if $args.eager }}loading="eager" fetchpriority="high"{{ else }}loading="lazy"{{ end }} decoding="async">{{ if $args.href }}</a>{{ end }}
{{- $caption := $args.caption | default .caption -}}
{{- if and $args.compact (not $args.caption) (ne .id "pantry") -}}{{- $caption = "一般イメージ・掲載商品ではありません" -}}{{- end -}}
<figcaption><span{{ if not $args.compact }} class="photo-purpose"{{ end }}>{{ $caption }}</span>
<details class="photo-credit"><summary>写真の出典・利用許諾</summary><p>{{ .caption }}<br><a href="{{ .source_url }}">作品の原掲載ページ</a> / {{ .author }} / <a href="{{ .license_url }}">{{ .license }}</a><br>{{ .attribution }}<br>{{ .modifications }} 表示枠に合わせた切り抜き表示あり。</p></details></figcaption></figure>
{{- end -}}
