baseURL = "https://hijoshoku-navi.com/"
locale = "ja"
title = "非常食ナビ"
theme = "PaperMod"
defaultContentLanguage = "ja"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[params]
  author = "非常食ナビ編集部"
  description = "いつもの暮らしに、もしもの備え。非常食の必要量、用途に合う選び方、アルファ米の違いを、公的機関やメーカーの情報をもとに整理する生活情報サイトです。"
  tagline = "いつもの暮らしに、もしもの備え。"
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  disableScrollToTop = true

[menu]
  [[menu.main]]
    identifier = "guide"
    name = "ガイド"
    url = "/guide/"
    weight = 1
  [[menu.main]]
    identifier = "ranking"
    name = "非常食比較"
    url = "/ranking/"
    weight = 2
  [[menu.main]]
    identifier = "alpha-mai"
    name = "アルファ米"
    url = "/posts/alpha-mai-osusume/"
    weight = 3

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true
